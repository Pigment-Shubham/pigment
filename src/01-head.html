<style>

.authin{font:inherit;padding:13px 16px;border-radius:999px;border:1.5px solid var(--line);outline:none;width:100%;box-sizing:border-box}
.authin:focus{border-color:var(--fg)}
.authrow{display:flex;gap:10px}.authrow .pill{flex:1;width:auto!important}
.authlink{background:none;border:0;color:var(--mute);text-decoration:underline;cursor:pointer;font:inherit;font-size:13px;align-self:center}
.authmsg{color:#c2321f;font-size:13px;text-align:center;min-height:1em}

:root[data-theme="dark"]{--bg:#0f0f13;--fg:#f2f2f6;--mute:#9b9ba8;--line:#2b2b34;--soft:#1a1a21;--card:#1a1a21;--onfg:#0f0f13;--barbg:rgba(15,15,19,.88);color-scheme:dark}
@media (prefers-color-scheme:dark){:root[data-theme="auto"]{--bg:#0f0f13;--fg:#f2f2f6;--mute:#9b9ba8;--line:#2b2b34;--soft:#1a1a21;--card:#1a1a21;--onfg:#0f0f13;--barbg:rgba(15,15,19,.88);color-scheme:dark}}
#bgLive{position:fixed;inset:0;width:100vw;height:100vh;height:100dvh;z-index:-1;object-fit:cover;opacity:.32;pointer-events:none}
.lookbtn{width:40px;height:40px;padding:0!important;flex:none}
.lookpop{position:fixed;right:max(16px,env(safe-area-inset-right,0px));top:70px;z-index:60;width:min(320px,calc(100vw - 32px));background:var(--card);color:var(--fg);border-radius:22px;padding:18px;box-shadow:0 18px 50px rgba(0,0,0,.22),0 0 0 1px var(--line);display:flex;flex-direction:column;gap:14px}
.lookpop h5{margin:0 0 8px;font:700 12px/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.lookpop .row{display:flex;gap:8px;flex-wrap:wrap}
.lookpop .sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;box-shadow:inset 0 0 0 1.5px var(--line)}
.lookpop .sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--fg)}
.setup{display:grid;gap:14px;max-width:760px}
.setup .step{display:grid;grid-template-columns:34px 1fr;gap:12px;align-items:start;background:var(--soft);border-radius:18px;padding:16px}
.setup .step b.n{display:grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--fg);color:var(--onfg);font-family:var(--display)}
.setup .step p{margin:0;line-height:1.5}.setup .note{color:var(--mute);font-size:14px;line-height:1.5}
@media (max-width:560px){.lookpop{top:112px}}
</style>
